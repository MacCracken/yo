name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Reusable-workflow trigger so release.yml can `uses:` this file as
  # the CI gate before publishing a release.
  workflow_call:

# Read-only by default. Nothing in CI writes to the repository; release.yml grants
# write to its release job alone.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1 (SHA-pinned)
        with:
          persist-credentials: false

      - name: Install Cyrius toolchain
        run: |
          set -e
          # The cyrius.cyml `[package].cyrius` pin is the single source of
          # truth for the toolchain version — no version hardcoded here. Use
          # the upstream installer (NOT a hand-rolled curl+cp): it lays out
          # $HOME/.cyrius/versions/<v>/ which `cyrius deps` pin-checks. The
          # old curl+cp into a flat ~/.cyrius/lib failed that check (and its
          # `|| true` masked a 404'd release asset → a silent 0s no-op).
          CYRIUS_VERSION="$(grep '^cyrius = ' cyrius.cyml | head -1 | sed 's/cyrius = "\(.*\)"/\1/')"
          echo "Installing Cyrius $CYRIUS_VERSION"
          # The installer is taken at the pinned tag, not cyrius `main`: it is the
          # code that verifies the release tarball's checksum and Ed25519
          # signature, so an unpinned copy could skip all of it.
          curl -sSf "https://raw.githubusercontent.com/MacCracken/cyrius/${CYRIUS_VERSION}/scripts/install.sh" | \
            CYRIUS_VERSION="$CYRIUS_VERSION" sh
          echo "$HOME/.cyrius/bin" >> "$GITHUB_PATH"

      - name: Resolve dependencies
        # --locked (cyrius >= 6.7.6) resolves the tags, writes nothing, and fails
        # naming each difference from the committed cyrius.lock. Plain `cyrius deps`
        # fails on a stdlib hash that disagrees with the pin, but silently re-locks
        # a wrong lib/taar.cyr hash and exits 0 (tested at 6.7.9). The build steps
        # below then vendor lib/ from the same tags.
        run: cyrius deps --locked

      - name: Build
        run: |
          mkdir -p build
          cyrius build src/main.cyr build/${{ github.event.repository.name }}

      - name: Build (AGNOS target)
        # ⛔ THIS IS NOT REDUNDANT WITH THE BUILD ABOVE. src/platform.cyr
        # dispatches on `#ifdef CYRIUS_TARGET_AGNOS`, so the host build compiles
        # src/platform_linux.cyr and NEVER TOUCHES src/platform_agnos.cyr. Until
        # this step existed, nothing in CI compiled the AGNOS backend at all and a
        # break there would have landed green — while the backend is iron-validated
        # and a headline feature. `cyrius test` cannot cover it either: the test
        # binary is a host build, so every assertion runs against the Linux arm.
        run: cyrius build --agnos src/main.cyr build/${{ github.event.repository.name }}-agnos

      - name: Cleanliness (cyrius audit)
        # fmt, lint and doc-coverage gates over src/ and tests/ (plus a test and
        # bench pass). Nothing gated these before 0.7.2, and the P(-1) audit
        # found 8 lint warnings and 46 undocumented functions; it exits 1 on any.
        run: cyrius audit

      - name: Test
        # v5.6.28: bare `cyrius test` picks up the [build].test entry
        # AND auto-discovers tests/*.tcyr — avoids the previous
        # `cyrius test src/test.cyr` form that hard-failed when the
        # stub didn't exist (Issue 1) and also wouldn't ever exercise
        # tests/${proj}.tcyr.
        run: cyrius test

      - name: Bench + fuzz
        # Both are green and cheap, and both compile module combinations the main
        # build does not (tests/yo.bcyr pulls icmp + taar + ipv6 + stats + output
        # together). Cheap insurance against a bit-rotted harness — the bench file
        # sat as a `noop` stub for six releases without anyone noticing.
        run: |
          cyrius bench
          cyrius fuzz
          # --poison: redzones around every allocation, so a heap overrun in a
          # parser exits 86 instead of passing silently (it is how the qname
          # overflow fixed in 0.7.2 would have shown up).
          cyrius fuzz --poison

      - name: Integration (network namespace)
        # Runs the built binary end to end inside a fresh network + mount
        # namespace: the SOCK_RAW fallback, Ctrl-C, RSS over a long run, and DNS
        # against a fake server (tests/integration/run.sh). The runner restricts
        # unprivileged user namespaces, so the script uses `sudo unshare`;
        # YO_REQUIRE_NETNS=1 makes "could not enter a namespace" a failure, not
        # a silent skip.
        run: YO_REQUIRE_NETNS=1 bash tests/integration/run.sh

      # NOTE: scripts/agnos-qemu-smoke.sh is deliberately NOT run here. It needs
      # sibling checkouts (agnos, gnoboot, agnoshi) plus QEMU + OVMF, which a
      # GitHub runner does not have — it would SKIP on every run and read as
      # coverage that does not exist. It stays a manual, local gate; see
      # docs/development/state.md § Verification.
